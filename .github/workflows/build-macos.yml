name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build (optional, e.g. v1.3.5)
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Select source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "Expected a tag such as v1.3.5." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false
      - name: Read app version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          plutil -lint Scripts/Info.plist
          version=$(plutil -extract CFBundleShortVersionString raw Scripts/Info.plist)
          build=$(plutil -extract CFBundleVersion raw Scripts/Info.plist)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$build" =~ ^[0-9]+$ ]]; then
            echo "Expected a three-part app version and an integer build number." >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match app version $version." >&2
            exit 1
          fi
          echo "name=Alto-Transcription-v$version-macOS-arm64" >> "$GITHUB_OUTPUT"
      - name: Test and build
        run: |
          swift --version
          xcodebuild -version
          swift test -c release --no-parallel
          ./Scripts/build-app.sh
      - name: Report test crashes
        if: failure()
        run: |
          reports="$HOME/Library/Logs/DiagnosticReports"
          if [[ -d "$reports" ]]; then
            find "$reports" -maxdepth 1 -name 'AltoTranscriptionPackageTests*' -print -exec head -c 20000 {} \;
          fi
          log show --last 2m --style compact --predicate 'process BEGINSWITH "AltoTranscriptionPackageTests"' | tail -60
      - name: Package and verify app
        env:
          ASSET_NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p artifacts
          app_name=$(plutil -extract CFBundleName raw Scripts/Info.plist)
          app="dist/$app_name.app"
          zip="$ASSET_NAME.zip"
          ditto -c -k --keepParent "$app" "artifacts/$zip"
          unpacked=$(mktemp -d)
          trap 'rm -rf "$unpacked"' EXIT
          ditto -x -k "artifacts/$zip" "$unpacked"
          extracted="$unpacked/$app_name.app"
          codesign --verify --deep --strict --verbose=2 "$extracted"
          lipo "$extracted/Contents/MacOS/AltoTranscription" -verify_arch arm64
          (
            cd artifacts
            shasum -a 256 "$zip" > "$zip.sha256"
            shasum -a 256 -c "$zip.sha256"
          )
          {
            echo "Commit: $(git rev-parse HEAD)"
            xcodebuild -version
            swift --version
          } | tee artifacts/BUILD.txt >> "$GITHUB_STEP_SUMMARY"
          if [[ -x Scripts/package-dmg.sh ]]; then
            ./Scripts/package-dmg.sh artifacts
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.name }}
          path: artifacts/
          if-no-files-found: error
